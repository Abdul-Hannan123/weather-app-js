<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Api</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="card">
            <div class="search-bar">
                <input type="text" placeholder="Enter city name" spellcheck="false">
                <button><img src="images/search.png" alt="">
                </button>
            </div>
            <div class="error">
                Invalid city name and make sure your spelling is correct
            </div>
            <div class="weather">
                <div class="container">
                    <img src="images/clear.png" class="container-image">
                    <h2 class="temp">15°C</h2>
                    <h2 class="city-name">Lahore</h2>
                </div>
                <div class="side-pictures ">
                    <div class="left-image">
                        <img src="images/humidity.png">
                        <div class="humidity">
                            <h3>65%</h3>
                            <h4>Humidity</h4>
                        </div>
                    </div>
                    <div class="right-image">
                        <img src="images/wind.png">
                        <div class="wind-speed">
                            <h3>65 Km/h</h3>
                            <h4> Wind speed</h4>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </header>

    <script src="script.js"></script>
</body>

</html>
